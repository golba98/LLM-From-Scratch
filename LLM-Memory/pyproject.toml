[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-memory"
version = "0.1.0"
description = "Scoped SQLite conversation storage and exact cosine retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy==2.5.1"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_memory*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
