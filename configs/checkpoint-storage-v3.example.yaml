# Experimental fragment for a NEW namespace, not a production launch configuration.
# Legacy remains the production default. Simulation never authorizes deletion.
checkpoint_storage_backend: optimized
checkpoint_store_root: checkpoint-groups/new-continuous-v3-experiment
checkpoint_reclamation_mode: simulate
# Optional explicit evidence, rehashed and checked against this model/optimizer.
# checkpoint_optimizer_storage_evidence: outputs/checkpoint-storage-v3-validation/capacity-evidence.json
checkpoint_retention:
  continuous: true
  max_snapshots: 6
  minimum_rollback_states: 1
  pinned_snapshots: []
  # Supply bounds validated for the actual optimizer representation. Without such
  # evidence the existing training preflight retains its conservative FP32 estimate.
  # Default V3 quota: (max_snapshots + 4) * max_checkpoint_bytes + 8 MiB.
  # Separate store-scoped approval is required for execution; config cannot issue it.
# V3.1 is migration-free; see documentation/training/CODEXA_CHECKPOINT_STORAGE_V3_1.md.
# Fresh metadata traversal/status parsing optimizations do not authorize execution.
