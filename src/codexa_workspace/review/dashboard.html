<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self' ws: wss:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style>
:root{
  --bg:#0f1115;--panel:#161a21;--panel-2:#1c212a;--raised:#222834;--border:#2b3240;--border-strong:#3a4354;
  --text:#e6e9ef;--muted:#9aa4b5;--faint:#6f7a8c;--accent:#7aa2ff;--accent-ink:#0b1430;
  --ok:#4cc38a;--ok-bg:#12301f;--bad:#f2777a;--bad-bg:#3a1618;--warn:#e6b450;--warn-bg:#352a10;--neutral-bg:#252b36;
  --focus:#ffd166;--mono:ui-monospace,SFMono-Regular,"JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Cantarell,"Noto Sans",Roboto,Ubuntu,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f6f8;--panel:#ffffff;--panel-2:#f8f9fb;--raised:#eef1f5;--border:#d9dee6;--border-strong:#c3cad6;
  --text:#1b1f27;--muted:#4f5a6b;--faint:#6b7585;--accent:#2f5bd3;--accent-ink:#ffffff;
  --ok:#1d7a4c;--ok-bg:#dff3e8;--bad:#b42328;--bad-bg:#fbe3e4;--warn:#8a5a00;--warn-bg:#fbefd2;--neutral-bg:#eceff4;
  --focus:#b35c00;color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-40px;background:var(--accent);color:var(--accent-ink);padding:6px 10px;border-radius:6px;z-index:50}
.skip:focus{top:8px}
kbd{font:12px var(--mono);background:var(--raised);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* Header */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.topbar-inner{display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.1px;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub code{font-family:var(--mono)}
.progress{display:flex;align-items:center;gap:10px;min-width:220px}
.progress .bar{flex:1;height:6px;background:var(--raised);border-radius:99px;overflow:hidden;min-width:90px}
.progress .bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.progress .nums{font-size:12.5px;color:var(--muted);white-space:nowrap}
.progress .nums b{color:var(--text);font-weight:600}
.field-inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.field-inline input{width:150px}
.save-state{font-size:12px;color:var(--faint);white-space:nowrap}
.save-state.err{color:var(--warn)}
.tabs{display:flex;gap:2px;padding:0 18px;align-items:center}
.tabs .save-state{margin-left:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;font-weight:550}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}

/* Controls */
.btn{background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--panel-2);border:1px solid var(--border-strong);border-radius:7px;padding:6px 9px}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{width:100%;min-height:72px;resize:vertical;line-height:1.45}

/* Layout */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:18px;padding:16px 18px 40px;max-width:1680px;margin:0 auto;align-items:start}
.sidebar{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden;padding-right:4px}
.sidebar select{width:100%;min-width:0}
.evalcol{position:sticky;top:96px}
.layout.summary-mode{grid-template-columns:250px minmax(0,1fr)}
.facet{margin:0 0 16px}
.facet h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 6px;font-weight:650}
.facet-list{display:flex;flex-direction:column;gap:1px}
.facet-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-radius:7px;padding:5px 9px;color:var(--muted);cursor:pointer;text-align:left}
.facet-btn:hover{background:var(--panel-2);color:var(--text)}
.facet-btn[aria-pressed="true"]{background:var(--raised);color:var(--text);font-weight:600}
.facet-btn .count{font:12px var(--mono);color:var(--faint)}
.facet-btn[aria-pressed="true"] .count{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--faint)}
.dot.approve{background:var(--ok)}.dot.reject{background:var(--bad)}.dot.unsure{background:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--panel-2);border:1px solid var(--border);border-radius:99px;padding:3px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .count{font:11px var(--mono);opacity:.8;margin-left:3px}
.search{width:100%}
.row{display:flex;gap:8px;align-items:center}
.guidelines{font-size:13px;color:var(--muted)}
.guidelines summary{cursor:pointer;color:var(--text);font-weight:550}
.guidelines ul{padding-left:18px;margin:6px 0}

/* Record */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.recmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px}
.recmeta .pos{font-size:17px;font-weight:650}
.recmeta .overall{font-size:12.5px;color:var(--faint)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--border-strong);border-radius:99px;padding:2px 9px;color:var(--muted);background:var(--panel-2)}
.badge.model{color:var(--text);border-color:var(--accent)}
.badge.status-approve{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.badge.status-reject{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.badge.status-unsure{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.recid{font:12px var(--mono);color:var(--faint);margin-left:auto}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.label .aside{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.history{margin:0 0 16px;display:flex;flex-direction:column;gap:6px}
.turn{border:1px solid var(--border);border-radius:9px;padding:7px 11px;background:var(--panel-2);max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.turn .who{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:650;margin-bottom:2px}
.turn.assistant{align-self:flex-end;background:var(--raised)}
.prompt{font-size:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 20px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--panel-2);border-radius:0 9px 9px 0}
.answer-wrap{position:relative}
.answer{margin:0;font:14.5px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:13px 15px;tab-size:4}
.answer.collapsed{max-height:420px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.answer-empty{font-style:italic;color:var(--warn)}
.stop{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--neutral-bg);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.stop.cut{background:var(--warn-bg);color:var(--warn)}
.under{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.reference{margin-top:10px;padding:9px 12px;border:1px dashed var(--border-strong);border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}
.reference .label{margin-bottom:3px}
.diag{margin-top:16px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2)}
.diag>summary{cursor:pointer;padding:9px 12px;color:var(--muted);font-size:13.5px}
.diag>summary b{color:var(--text);font-weight:600}
.diag-body{padding:4px 12px 12px;font-size:13px}
.diag-note{color:var(--warn);font-size:12.5px;margin:2px 0 10px}
.diag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.diag-grid h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:0 0 4px}
.diag-grid dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:1px 10px}
.diag-grid dt{color:var(--muted);font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.diag-grid dd{margin:0;font-family:var(--mono);font-size:12px;text-align:right}
.v-true{color:var(--ok)}.v-false{color:var(--bad)}.v-null{color:var(--faint)}
#record:focus{outline:none}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}

/* Evaluation panel */
.evalpanel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.evalpanel h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 12px}
fieldset{border:0;margin:0 0 14px;padding:0;min-width:0}
legend{font-size:13px;font-weight:600;margin-bottom:6px;padding:0}
.seg{display:grid;gap:6px}
.seg.d4{grid-template-columns:1fr 1fr}
.seg.c4{grid-template-columns:1fr 1fr}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--panel-2);font-size:13.5px;user-select:none}
.seg label:hover{background:var(--raised)}
.seg label kbd{font-size:11px}
.seg input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.seg input:checked+label{font-weight:650;color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel-2))}
.seg input[value=approve]:checked+label{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.seg input[value=reject]:checked+label{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.seg input[value=unsure]:checked+label{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.navrow{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:6px}
.navrow .primary{grid-column:1/-1;padding:9px}
.small{font-size:12px;color:var(--faint)}
.toggle{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:12px}
.hint{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.7}

/* Summary */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.sum-card h3{margin:0 0 2px;font-size:17px}
.sum-card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.stat{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.stat b{display:block;font-size:18px}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.approve b{color:var(--ok)}.stat.reject b{color:var(--bad)}.stat.unsure b{color:var(--warn)}
.stackbar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--raised);margin:4px 0 12px}
.stackbar i{display:block;height:100%}
.sum-section{font-size:12.5px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.sum-card table{width:100%;border-collapse:collapse;font-size:13px}
.sum-card td{padding:2px 0;color:var(--muted)}
.sum-card td:last-child{text-align:right;font-family:var(--mono);color:var(--text)}
.machine{border-top:1px dashed var(--border-strong);margin-top:10px;padding-top:6px}
.machine .sum-section::after{content:" · machine-generated";text-transform:none;letter-spacing:0;color:var(--warn);font-weight:500}
.overall{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}
.overall .seg{grid-template-columns:repeat(3,1fr)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 11px;font-size:13px;margin:0 0 14px}
.notice.info{background:var(--neutral-bg);color:var(--muted)}

/* Dialog */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--border-strong);border-radius:12px;padding:0;max-width:min(560px,calc(100vw - 32px));width:100%;box-shadow:0 20px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-body{padding:18px 20px 6px}
.dlg-body h2{margin:0 0 10px;font-size:17px}
.dlg-body p,.dlg-body li{color:var(--muted);font-size:14px}
.dlg-body ul{padding-left:18px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}

.menu-btn{display:none}
@media (max-width:1240px){
  .layout{grid-template-columns:230px minmax(0,1fr)}
  .evalcol{position:static;grid-column:2}
}
@media (max-width:820px){
  .topbar{position:static}
  .topbar-inner{gap:8px 10px;padding:10px 12px}
  .layout,.layout.summary-mode{grid-template-columns:minmax(0,1fr);padding:12px 12px 40px}
  .evalcol{grid-column:1}
  .sidebar{position:fixed;inset:0 25% 0 0;max-height:none;top:0;z-index:40;background:var(--panel);border-right:1px solid var(--border);padding:16px;transform:translateX(-105%);transition:transform .18s}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .menu-btn{display:inline-block}
  .field-inline input{width:120px}
  .progress{min-width:0;flex:1 1 100%}
  .card{padding:14px}
  .recid{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#record">Skip to current response</a>
<header class="topbar">
  <div class="topbar-inner">
    <button class="btn ghost menu-btn" id="menu" aria-controls="sidebar" aria-expanded="false">Filters</button>
    <div class="brand">
      <h1>__TITLE__</h1>
      <div class="sub" id="pkginfo">__LABEL__</div>
    </div>
    <div class="progress" role="group" aria-label="Review progress">
      <div class="bar" aria-hidden="true"><span id="bar"></span></div>
      <div class="nums" id="progress" aria-live="polite"></div>
    </div>
    <label class="field-inline">Reviewer <input type="text" id="reviewer" autocomplete="name" placeholder="Your name" spellcheck="false"></label>
    <button class="btn" id="import">Import</button>
    <button class="btn primary" id="export">Export JSON</button>
    <button class="btn ghost" id="theme" title="Toggle light or dark theme">Theme</button>
    <button class="btn ghost" id="help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
    <input type="file" id="importfile" accept=".json,application/json" hidden>
  </div>
  <div class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-review" aria-selected="true" aria-controls="view-review">Review responses</button>
    <button class="tab" role="tab" id="tab-summary" aria-selected="false" aria-controls="view-summary">Model summary</button>
    <span class="save-state" id="savestate" aria-live="polite"></span>
  </div>
</header>

<div class="layout" id="layout">
  <nav class="sidebar" id="sidebar" aria-label="Filters and navigation">
    <div class="facet">
      <label class="sr-only" for="search">Search question text or ID</label>
      <input type="search" class="search" id="search" placeholder="Search text or ID  ( / )" autocomplete="off" spellcheck="false">
    </div>
    <div class="facet"><h2 id="h-status">Status</h2><div class="facet-list" id="f-status" role="group" aria-labelledby="h-status"></div></div>
    <div class="facet"><h2 id="h-group">Category</h2><div class="facet-list" id="f-group" role="group" aria-labelledby="h-group"></div></div>
    <div class="facet" id="facet-model"><h2 id="h-model">Anonymous model</h2><div class="chips" id="f-model" role="group" aria-labelledby="h-model"></div></div>
    <div class="facet">
      <h2>Order &amp; jump</h2>
      <div class="row" style="margin-bottom:6px">
        <label class="sr-only" for="order">Order</label>
        <select id="order">
          <option value="package">Package order</option>
          <option value="question">By question (compare models)</option>
        </select>
      </div>
      <form class="row" id="jumpform">
        <label class="sr-only" for="jump">Go to question number in the current list</label>
        <input type="number" id="jump" min="1" placeholder="Go to #" style="flex:1;min-width:0">
        <button class="btn" type="submit">Go</button>
      </form>
    </div>
    <div class="facet">
      <details class="guidelines" id="guidelines"><summary>Review guidelines</summary><div id="guidelines-body"></div></details>
    </div>
  </nav>

  <main id="view-review" role="tabpanel" aria-labelledby="tab-review" style="min-width:0">
    <div id="notices"></div>
    <article class="card" id="record" tabindex="-1" aria-live="polite"></article>
  </main>

  <aside class="evalcol" id="evalcol" aria-label="Your evaluation">
    <form class="evalpanel" id="evalform" autocomplete="off">
      <h2>Your evaluation</h2>
      <fieldset>
        <legend>Decision</legend>
        <div class="seg d4" id="decision"></div>
      </fieldset>
      <fieldset id="coherence-fs">
        <legend>Coherence</legend>
        <div class="seg c4" id="coherence"></div>
      </fieldset>
      <label for="notes" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Notes <span class="small">(optional)</span></label>
      <textarea id="notes" placeholder="What was right or wrong?"></textarea>
      <div class="navrow" style="margin-top:12px">
        <button type="button" class="btn" id="prev" title="Previous (K or ←)">← Prev</button>
        <button type="button" class="btn" id="nextunrev" title="Next unreviewed (N)">Next unreviewed</button>
        <button type="submit" class="btn primary" id="savenext" title="Save &amp; next (Enter)">Save &amp; next →</button>
      </div>
      <label class="toggle"><input type="checkbox" id="autoadvance"> Advance automatically once decision and coherence are set</label>
      <p class="hint"><kbd>A</kbd> accept · <kbd>R</kbd> reject · <kbd>U</kbd> unsure · <kbd>P</kbd> pending<br><kbd>0</kbd><kbd>1</kbd><kbd>2</kbd> coherence · <kbd>J</kbd>/<kbd>K</kbd> next/prev · <kbd>N</kbd> next unreviewed · <kbd>?</kbd> all keys</p>
    </form>
  </aside>

  <main id="view-summary" role="tabpanel" aria-labelledby="tab-summary" hidden style="min-width:0"></main>
</div>

<dialog id="dialog" aria-labelledby="dlg-title"><form method="dialog"><div class="dlg-body" id="dlg-body"></div><div class="dlg-actions" id="dlg-actions"></div></form></dialog>

<script id="package" type="application/json">__PACKAGE_JSON__</script>
<script>
'use strict';
/*CORE*/
const CodexaCore = (() => {
  const EXPORT_FORMAT = 'codexa-human-review-export-v1';
  const DASHBOARD = '__DASHBOARD_VERSION__';
  const DECISIONS = ['approve', 'reject', 'unsure', 'pending'];
  const GROUP_LABELS = {factual: 'Factual knowledge', multi_turn: 'Conversation (multi-turn)', retention: 'Retention',
    instruction: 'Instruction following', arithmetic: 'Arithmetic', reasoning: 'Reasoning', length: 'Length constraint',
    natural: 'Natural conversation', comprehension: 'Comprehension', context: 'Context retention'};
  const groupLabel = g => GROUP_LABELS[g] ?? String(g ?? 'Uncategorized').replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
  const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  const str = v => (v === null || v === undefined) ? '' : String(v);

  function turn(entry) {
    if (Array.isArray(entry)) return {role: str(entry[0]), text: str(entry[1])};

      const box = h('div', {class: 'reference', hidden: true, id: 'refbox'}, h('div', {class: 'label'}, 'Reference answer (development case)'), it.reference);
      const btn = h('button', {type: 'button', class: 'btn ghost', id: 'refbtn', 'aria-expanded': 'false', 'aria-controls': 'refbox', title: 'Reveal reference (V)'}, 'Reveal reference answer');
      btn.addEventListener('click', () => { box.hidden = !box.hidden; btn.setAttribute('aria-expanded', String(!box.hidden)); btn.textContent = box.hidden ? 'Reveal reference answer' : 'Hide reference answer'; });
      under.append(btn);
      parts.push(under, box);
    } else if (under.childNodes.length) parts.push(under);
    if (it.metrics) {
      const det = h('details', {class: 'diag', id: 'diag'}, h('summary', null, h('b', null, 'Automated diagnostics'), ' · machine-generated, optional'));
      det.addEventListener('toggle', () => { if (det.open && det.childNodes.length === 1) det.append(buildDiagnostics(it.metrics)); });
      parts.push(det);
    }
    card.replaceChildren(...parts);
    currentRendered = it.id;
    syncEval();
  }

  // ---- evaluation panel ----
  const DEC_OPTS = [['approve', 'Accept', 'A', 'Correct / acceptable'], ['reject', 'Reject', 'R', 'Incorrect / unacceptable'],
    ['unsure', 'Unsure', 'U', 'Needs another look — exported as pending'], ['pending', 'Pending', 'P', 'Not decided yet']];
  const COH_OPTS = [['2', 'Coherent', '2'], ['1', 'Partly coherent', '1'], ['0', 'Incoherent', '0'], ['', 'Unrated', '']];
  function seg(container, name, opts) {
    container.replaceChildren(...opts.flatMap(([value, label, key, title]) => {
      const id = `${name}-${value || 'none'}`;
      return [h('input', {type: 'radio', name, id, value}), h('label', {for: id, title: title ?? null}, h('span', null, label), key ? h('kbd', null, key) : null)];
    }));
  }
  seg($('decision'), 'decision', DEC_OPTS);
  seg($('coherence'), 'coherence', COH_OPTS);

  function setEvalEnabled(on) { for (const el of $('evalform').querySelectorAll('input,textarea,button')) if (el.id !== 'autoadvance') el.disabled = !on; }
  function syncEval() {
    const it = currentItem(); if (!it) return;
    const d = state.decisions[it.id];
    for (const r of document.getElementsByName('decision')) r.checked = r.value === d.decision;
    for (const r of document.getElementsByName('coherence')) r.checked = r.value === (d.coherence === null ? '' : String(d.coherence));
    if ($('notes').value !== d.comments) $('notes').value = d.comments;
    $('coherence-fs').hidden = it.kind !== 'model' && it.kind !== '';
    $('prev').disabled = view.pos === 0;
  }

  function setDecision(value) {
    const it = currentItem(); if (!it) return;
    state.decisions[it.id].decision = value;
    afterEdit(it);
  }
  function setCoherence(value) {
    const it = currentItem(); if (!it) return;
    state.decisions[it.id].coherence = value === '' ? null : Number(value);
    afterEdit(it);
  }
  function afterEdit(it) {
    changed();
    renderProgress(); renderFacets();
    const d = state.decisions[it.id];
    // Refresh only the status badge rather than rebuilding the record (keeps scroll and open panels).
    const badge = $('statusbadge');
    if (badge) badge.replaceWith(statusBadgeFor(d.decision));
    syncEval();
    if (autoAdvance && (d.decision === 'approve' || d.decision === 'reject') && (d.coherence !== null || it.kind !== 'model')) setTimeout(() => go(+1), 120);
  }

  $('decision').addEventListener('change', e => setDecision(e.target.value));
  $('coherence').addEventListener('change', e => setCoherence(e.target.value));
  $('notes').addEventListener('input', () => { const it = currentItem(); if (!it) return; state.decisions[it.id].comments = $('notes').value; changed(); });
  $('autoadvance').addEventListener('change', e => { autoAdvance = e.target.checked; store.set('codexa-review:auto-advance', autoAdvance ? '1' : '0'); });

  function go(delta) {
    if (!view.list.length) return;
    // The filtered list can shrink when the status filter excludes the item just decided.
    const cur = currentItem();
    const kept = refilter(cur && cur.id);
    // If the current item left the view, the item now at pos is already the next one.
    const before = view.pos;
    if (kept || delta < 0) view.pos = C.step(view.list, view.pos, delta);
    renderAll(); saveNow(); focusRecord();
    if (kept && view.pos === before) flash(delta > 0 ? 'End of this list. Use Next unreviewed or change filters.' : 'Start of this list.');
  }
  function goNextUnreviewed() {
    const cur = currentItem();
    const kept = refilter(cur && cur.id);
    const p = C.nextUnreviewed(view.list, kept ? view.pos : view.pos - 1, items, state);
    if (p < 0) { flash('Every response in this view has an Accept or Reject decision.'); return; }
    view.pos = p; renderAll(); saveNow(); focusRecord();
  }
  function focusRecord() { $('record').focus({preventScroll: true}); window.scrollTo({top: 0}); }
  $('prev').addEventListener('click', () => go(-1));
  $('nextunrev').addEventListener('click', goNextUnreviewed);
  $('evalform').addEventListener('submit', e => { e.preventDefault(); go(+1); });

  function flash(message) {
    const n = h('div', {class: 'notice info', role: 'status'}, message);
    $('notices').replaceChildren(n);
    setTimeout(() => { if (n.isConnected) n.remove(); }, 4000);
  }

  // ---- sidebar controls ----
  let searchTimer = null;
  $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => setFilter('query', $('search').value.trim()), 150); });
  $('order').addEventListener('change', () => setFilter('order', $('order').value));
  $('jumpform').addEventListener('submit', e => {
    e.preventDefault();
    const n = parseInt($('jump').value, 10);
    if (!Number.isFinite(n) || n < 1 || n > view.list.length) { flash(`Enter a number from 1 to ${view.list.length}.`); return; }
    view.pos = n - 1; $('jump').value = ''; renderAll(); saveNow(); focusRecord();
  });
  function toggleMenu(open) { $('sidebar').classList.toggle('open', open); $('menu').setAttribute('aria-expanded', String(open)); }
  $('menu').addEventListener('click', () => toggleMenu(!$('sidebar').classList.contains('open')));
  document.addEventListener('click', e => {
    if ($('sidebar').classList.contains('open') && !$('sidebar').contains(e.target) && !$('menu').contains(e.target)) toggleMenu(false);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sidebar').classList.contains('open')) { toggleMenu(false); $('menu').focus(); } });

  (() => {
    const warnings = [...new Set(items.flatMap(it => it.warnings))];
    const body = $('guidelines-body');
    if (pkg.rubric) body.append(h('p', null, String(pkg.rubric)));
    if (warnings.length) body.append(h('ul', null, warnings.map(w => h('li', null, w))));
    body.append(h('p', null, 'Accept only a correct, relevant, complete response. Reject incorrect, contradictory or unsupported answers. Use Unsure when you want to revisit — it exports as pending, never as a decision. Rate coherence separately.'));
  })();

  // ---- summary ----
  function count(list, pred) { let n = 0; for (const x of list) if (pred(x)) n++; return n; }
  function triSeg(alias, key, label) {
    const name = `ov-${alias}-${key}`.replace(/\W+/g, '-');
    const value = state.candidates[alias][key];
    const fs = h('fieldset', null, h('legend', null, label));
    const s = h('div', {class: 'seg'});
    for (const [v, text] of [['null', 'Not decided'], ['true', 'Yes'], ['false', 'No']]) {
      const id = `${name}-${v}`;
      const input = h('input', {type: 'radio', name, id, value: v});
      input.checked = String(value) === v;
      input.addEventListener('change', () => { state.candidates[alias][key] = v === 'null' ? null : v === 'true'; changed(); renderSummary(); });
      s.append(input, h('label', {for: id}, text));
    }
    fs.append(s);
    return fs;
  }
  function renderSummary() {
    const root = $('view-summary');
    const intro = h('div', {class: 'notice info'}, 'Overall judgments are separate decisions you make after reviewing. They are never calculated from the per-response counts or the automated checks, and they do not override other eligibility gates.');
    const list = aliases.length ? aliases : [null];
    const cards = list.map(alias => {
      const subset = items.filter(it => alias === null || it.alias === alias);
      const t = C.tally(subset, state);
      const pct = n => t.total ? (100 * n / t.total) + '%' : '0';
      const ms = subset.map(it => it.metrics).filter(Boolean);
      const card = h('section', {class: 'card sum-card', 'aria-label': alias ?? 'All responses'},
        h('div', {class: 'row', style: 'justify-content:space-between'}, h('h3', null, alias ?? 'All responses'),
          h('button', {type: 'button', class: 'btn', onclick: () => { view.alias = alias ?? 'all'; view.status = 'all'; switchTab('review'); refilter(); renderAll(); }}, 'Review these')),
        h('div', {class: 'small'}, `${t.total} responses · ${t.reviewed} decided`),
        h('div', {class: 'stats'},
          h('div', {class: 'stat approve'}, h('b', null, String(t.approve)), h('span', null, 'Accepted')),
          h('div', {class: 'stat reject'}, h('b', null, String(t.reject)), h('span', null, 'Rejected')),
          h('div', {class: 'stat unsure'}, h('b', null, String(t.unsure)), h('span', null, 'Unsure')),
          h('div', {class: 'stat'}, h('b', null, String(t.pending)), h('span', null, 'Pending'))),
        h('div', {class: 'stackbar', role: 'img', 'aria-label': `${t.approve} accepted, ${t.reject} rejected, ${t.unsure} unsure, ${t.pending} pending`},
          h('i', {style: `width:${pct(t.approve)};background:var(--ok)`}), h('i', {style: `width:${pct(t.reject)};background:var(--bad)`}),
          h('i', {style: `width:${pct(t.unsure)};background:var(--warn)`})),
        h('div', {class: 'sum-section'}, 'Your coherence ratings'),
        h('table', null, h('tbody', null,
          [['Coherent', t.coherence[2]], ['Partly coherent', t.coherence[1]], ['Incoherent', t.coherence[0]], ['Unrated', t.coherence.unrated]]
            .map(([k, v]) => h('tr', null, h('td', null, k), h('td', null, String(v)))))));
      if (ms.length) {
        const rows = [];
        const has = k => ms.some(m => k in m);
        if (has('task_pass')) rows.push(['Exact task check passed', `${count(ms, m => m.task_pass === true)} / ${count(ms, m => typeof m.task_pass === 'boolean')}`]);
        if (has('ended_with_END')) rows.push(['Stopped with END', String(count(ms, m => m.ended_with_END === true))]);
        if (has('ended_with_EOS')) rows.push(['Stopped with EOS', String(count(ms, m => m.ended_with_EOS === true))]);
        if (has('ended_with_END')) rows.push(['No stop token recorded', String(count(ms, m => m.ended_with_END === false && m.ended_with_EOS !== true))]);
        if (has('severe_degeneration')) rows.push(['Severe repetition flagged', String(count(ms, m => m.severe_degeneration === true))]);
        if (has('format_compliance')) rows.push(['Format compliance failed', String(count(ms, m => m.format_compliance === false))]);
        if (rows.length) card.append(h('div', {class: 'machine'}, h('div', {class: 'sum-section'}, 'Automated checks'),
          h('table', null, h('tbody', null, rows.map(([k, v]) => h('tr', null, h('td', null, k), h('td', null, v)))))));
      }
      if (alias !== null) {
        const ov = h('div', {class: 'overall'}, h('div', {class: 'sum-section'}, 'Your overall human assessment'));
        if (t.total - t.reviewed) ov.append(h('p', {class: 'small'}, `${t.total - t.reviewed} response(s) for ${alias} still have no Accept/Reject decision.`));
        ov.append(triSeg(alias, 'accepted', 'Model accepted overall'), triSeg(alias, 'retention_acceptable', 'Retention acceptable'));
        card.append(ov);
      }
      return card;
    });
    root.replaceChildren(intro, h('div', {class: 'summary-grid'}, cards));
  }

  function switchTab(tab) {
    view.tab = tab;
    const review = tab === 'review';
    $('tab-review').setAttribute('aria-selected', String(review));
    $('tab-summary').setAttribute('aria-selected', String(!review));
    $('view-review').hidden = !review; $('evalcol').hidden = !review; $('view-summary').hidden = review;
    $('layout').classList.toggle('summary-mode', !review);
    if (!review) renderSummary(); else renderRecord();
  }
  $('tab-review').addEventListener('click', () => switchTab('review'));
  $('tab-summary').addEventListener('click', () => switchTab('summary'));

  function renderAll() { $('jump').max = String(Math.max(1, view.list.length)); renderFacets(); renderProgress(); if (view.tab === 'review') renderRecord(); else renderSummary(); }

  // ---- dialogs (no native alert/confirm) ----
  function dialog(title, body, buttons) {
    return new Promise(resolve => {
      const dlg = $('dialog');
      $('dlg-body').replaceChildren(h('h2', {id: 'dlg-title'}, title), ...[].concat(body));
      $('dlg-actions').replaceChildren(...buttons.map(([value, label, primary]) => h('button', {value, class: 'btn' + (primary ? ' primary' : '')}, label)));
      dlg.addEventListener('close', () => resolve(dlg.returnValue), {once: true});
      dlg.returnValue = '';
      dlg.showModal();
      const primary = $('dlg-actions').querySelector('.primary'); if (primary) primary.focus();
    });
  }

  // ---- export ----
  $('export').addEventListener('click', async () => {
    const reviewer = $('reviewer').value.trim();
    if (!reviewer) {
      await dialog('Reviewer name required', h('p', null, 'Enter your real name in the Reviewer field before exporting. Exports record who made the decisions.'), [['ok', 'OK', true]]);
      $('reviewer').focus(); return;
    }
    const t = C.tally(items, state);
    const undecided = Object.values(state.candidates).reduce((n, v) => n + (v.accepted === null) + (v.retention_acceptable === null), 0);
    const body = [h('ul', null, h('li', null, `${t.approve} accepted, ${t.reject} rejected`),
      h('li', null, `${t.unsure} unsure (exported as pending with needs_review)`), h('li', null, `${t.pending} pending`),
      aliases.length ? h('li', null, `${undecided} overall judgment(s) not decided (exported as null)`) : null),
      h('p', null, t.reviewed < t.total || undecided ? 'This export is a progress record. Pending and undecided values will be refused by the importer until you decide them — nothing is treated as approved.' : 'Every response has an explicit decision.'),
      h('p', {class: 'small'}, `Reviewer: ${reviewer} · package …${sha.slice(-8)}`)];
    if (await dialog('Export review decisions?', body, [['cancel', 'Cancel'], ['ok', 'Download JSON', true]]) !== 'ok') return;
    let result;
    try { result = C.buildExport(pkg, items, state, reviewer); } catch (err) { await dialog('Export failed', h('p', null, err.message), [['ok', 'OK', true]]); return; }
    const a = h('a', {download: `codexa-review-decisions-${sha.slice(0, 8)}-${new Date().toISOString().slice(0, 10)}.json`});
    a.href = URL.createObjectURL(new Blob([JSON.stringify(result, null, 2)], {type: 'application/json'}));
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    dirtySinceExport = false;
    flash('Exported. Keep the downloaded file — it is the review record; the browser draft is only a convenience.');
  });

  // ---- import ----
  $('import').addEventListener('click', () => $('importfile').click());
  $('importfile').addEventListener('change', async () => {
    const file = $('importfile').files[0];
    $('importfile').value = '';
    if (!file) return;
    let parsed;
    try { parsed = C.parseImport(await file.text(), pkg, items); }
    catch (err) { await dialog('Import refused', h('p', null, err.message), [['ok', 'OK', true]]); return; }
    if (C.hasWork(state)) {
      const now = C.tally(items, state), next = C.tally(items, parsed.state);
      const choice = await dialog('Replace current progress?', [
        h('p', null, `Current: ${now.approve} accepted, ${now.reject} rejected, ${now.unsure} unsure, ${now.pending} pending.`),
        h('p', null, `File: ${next.approve} accepted, ${next.reject} rejected, ${next.unsure} unsure, ${next.pending} pending.`),
        h('p', {class: 'small'}, 'Your current draft will be kept as a local backup before it is replaced.')],
        [['cancel', 'Cancel'], ['ok', 'Replace with file', true]]);
      if (choice !== 'ok') return;
      store.set(`codexa-review:${sha}:backup`, C.serializeDraft(pkg, state, currentItem()?.id ?? null));
    }
    const cur = currentItem();
    state = parsed.state;
    if (!state.reviewer) state.reviewer = $('reviewer').value.trim();
    $('reviewer').value = state.reviewer;
    refilter(cur && cur.id); renderAll(); saveNow();
    dirtySinceExport = false;
    const t = C.tally(items, state);
    await dialog('Import complete', [h('p', null, `Imported ${file.name}: ${t.approve} accepted, ${t.reject} rejected, ${t.unsure} unsure, ${t.pending} pending.`),
      ...parsed.notices.map(n => h('p', {class: 'notice'}, n))], [['ok', 'OK', true]]);
  });

  // ---- reviewer identity ----
  $('reviewer').addEventListener('change', () => { state.reviewer = $('reviewer').value.trim(); saveNow(); });

  // ---- keyboard ----
  const typing = t => t instanceof Element && t.matches('textarea, select, [contenteditable], input:not([type=radio]):not([type=checkbox]):not([type=button]):not([type=submit])');
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || $('dialog').open) return;
    if (typing(e.target)) { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.key === '?') { e.preventDefault(); showHelp(); return; }
    if (view.tab !== 'review') return;
    const onRadio = e.target instanceof Element && e.target.matches('input[type=radio]');
    const onButton = e.target instanceof Element && e.target.matches('button, summary, a');
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const act = {a: () => setDecision('approve'), r: () => setDecision('reject'), u: () => setDecision('unsure'), p: () => setDecision('pending'),
      0: () => setCoherence('0'), 1: () => setCoherence('1'), 2: () => setCoherence('2'),
      j: () => go(+1), k: () => go(-1), n: goNextUnreviewed,
      '/': () => $('search').focus(),
      d: () => { const det = $('diag'); if (det) { det.open = !det.open; } },
      v: () => { const b = $('refbtn'); if (b) b.click(); }};
    if (!onRadio) { act.ArrowRight = () => go(+1); act.ArrowLeft = () => go(-1); }
    if (!onButton && !onRadio) act.Enter = () => go(+1);
    if (act[k]) { e.preventDefault(); act[k](); }
  });
  function showHelp() {
    const keys = [['A / R / U / P', 'Accept · Reject · Unsure · Pending'], ['2 / 1 / 0', 'Coherent · Partly coherent · Incoherent'],
      ['J or →', 'Next response'], ['K or ←', 'Previous response'], ['N', 'Next unreviewed'], ['Enter', 'Save & next'],
      ['/', 'Search'], ['D', 'Toggle automated diagnostics'], ['V', 'Reveal or hide reference answer'], ['Esc', 'Leave a text field'], ['?', 'This help']];
    dialog('Keyboard shortcuts', [h('div', {class: 'keys'}, keys.flatMap(([k, v]) => [h('kbd', null, k), h('span', null, v)])),
      h('p', {class: 'small'}, 'Shortcuts are ignored while typing in the reviewer, search, jump or notes fields.')], [['ok', 'Close', true]]);
  }
  $('help').addEventListener('click', showHelp);

  // ---- theme ----
  const savedTheme = store.get('codexa-review:theme');
  if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
  $('theme').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next; store.set('codexa-review:theme', next);
  });

  // ---- unload guard: only when the work cannot be recovered locally ----
  window.addEventListener('beforeunload', e => {
    if (saveTimer) saveNow();
    if (!store.ok && dirtySinceExport) { e.preventDefault(); e.returnValue = ''; }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) saveNow(); });

  // ---- start ----
  $('pkginfo').append(` · ${items.length} responses · package `, h('code', {title: sha}, '…' + sha.slice(-8)));
  autoAdvance = store.get('codexa-review:auto-advance') === '1';
  $('autoadvance').checked = autoAdvance;
  const lastReviewer = store.get(pointerKey);
  let restored = null;
  if (lastReviewer !== null) restored = C.restoreDraft(store.get(C.storageKey(sha, lastReviewer)), pkg, items);
  if (restored) { state = restored.state; }
  $('reviewer').value = state.reviewer;
  refilter(restored && restored.currentId);
  renderAll();
  if (restored && C.hasWork(state)) flash('Restored your local draft for this package. It is not a submitted review — export JSON to keep a file.');
  if (!store.ok) { $('savestate').textContent = 'Local saving unavailable — export to keep work'; $('savestate').className = 'save-state err'; }
  else if (store.get('codexa-review:probe') === null && !store.set('codexa-review:probe', '1')) { $('savestate').textContent = 'Local saving unavailable — export to keep work'; $('savestate').className = 'save-state err'; }
})();
</script>
</body>
</html>
